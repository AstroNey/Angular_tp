@if (task()) {
    <div
         [routerLink]="['details', task().id]"
         class="card-container">
        <div class="card-info-container">
            <h3 class="card-info-title" id="taskTitle">
                {{ task().title }}
            </h3>
            @if (task().description) {
                <p class="card-info-description" id="taskDescription">
                    {{ task().description }}
                </p>
            }
        </div>
        <div class="card-actions-container">
            <div class="card-actions-button-container">
                <button
                    id="updateTaskButton"
                    (click)="updateTask($event)"
                    aria-label="Modifier la tâche"
                    class="card-actions-button">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="icons">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 19.07a4.5 4.5 0 0 1-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 0 1 1.13-1.897L16.863 4.487Zm0 0L19.5 7.125"/>
                    </svg>
                </button>
                <button
                    id="deleteTaskButton"
                    (click)="deleteTask($event)"
                    aria-label="Supprimer la tâche"
                    class="card-actions-button delete-button">
                    <svg class="icons" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" fill="none"  stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.3">
                        <path d="m5.75 4.25v-2.5h4.5v2.5m-6.5 1v9h8.5v-9m-9.5-.5h10.5"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>
}
