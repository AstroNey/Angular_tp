<div class="column-container">
    <div class="button-container">
        <span [ngClass]="{
                'bg-yellow-100 text-yellow-800': state() === 'TODO',
                'bg-blue-100 text-blue-800': state() === 'IN PROGRESS',
                'bg-green-100 text-green-800': state() === 'DONE'
                }" class="column-header">
            {{ state() }}
        </span>
        <button (click)="createTask()" class="add-button">
            <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="icons">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
            </svg>
        </button>
    </div>
    <div class="grid-task-container"
         cdkDropList
         [cdkDropListConnectedTo]="connectedDropLists()"
         (cdkDropListDropped)="dropTask($event)"
         [cdkDropListData]="tasksInThisColumn()"
         id="{{state()}}">
        @if (tasksInThisColumn().length > 0) {
            @for (task of tasksInThisColumn(); track task) {
                <app-task-card [task]="task"
                               cdkDrag
                               [cdkDragData]="task">
                </app-task-card>
            }
        }
    </div>

    @defer (when !!taskId) {
        @if (taskId) {
            <app-task-details [id]="taskId"></app-task-details>
        }
    } @error {
        <div class="error-message">
            An error occurred while loading task details.
        </div>
    }
</div>
