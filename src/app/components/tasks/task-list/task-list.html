<div class="bg-[#28272D] rounded-lg flex flex-col p-4">
    <span [ngClass]="{
        'bg-yellow-100 text-yellow-800': state() === 'TODO',
        'bg-blue-100 text-blue-800': state() === 'IN PROGRESS',
        'bg-green-100 text-green-800': state() === 'DONE'
      }"
          class="text-xs font-semibold uppercase px-3 py-2 rounded-full text-center ">{{ state() }}</span>
    <div class="grid grid-cols-1 gap-6 p-2"
         cdkDropList
         [cdkDropListConnectedTo]="['DONE','IN PROGRESS','TODO']"
         (cdkDropListDropped)="dropTask($event)"
         [cdkDropListData]="tasksInThisColumn()"
         id="{{state()}}">
        @if (tasksInThisColumn().length > 0) {
            @for (task of tasksInThisColumn(); track task) {
                <app-task-card [task]="task"
                               cdkDrag
                               [cdkDragData]="task">
                </app-task-card>
            }
        }
    </div>
    <div class="flex justify-end pb-2 pr-2">
        <button
            (click)="createTask()"
            class="inline-flex items-center space-x-2 px-4 py-2 rounded-md font-medium text-white
           bg-blue-600 hover:bg-blue-700 transition-colors
           focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
            <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
            </svg>
        </button>
    </div>
    @if (taskId) {
        <app-task-details [id]="taskId"></app-task-details>
    }
</div>
